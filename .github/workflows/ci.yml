name: ci

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build
        run: |
          sudo apt-get install -y ninja-build
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Integration tests
        run: |
          pip install -r tests/integration/requirements.txt
          AMMIO_BIN=build/ammio pytest tests/integration -v

  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build with AddressSanitizer + UndefinedBehaviorSanitizer
        run: |
          sudo apt-get install -y ninja-build
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests
        env:
          ASAN_OPTIONS: detect_leaks=1:exitcode=99
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1:exitcode=98
        run: |
          ctest --test-dir build --output-on-failure
          pip install -r tests/integration/requirements.txt
          AMMIO_BIN=build/ammio pytest tests/integration -v

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build
        shell: cmd
        run: |
          call scripts\build_windows-x64.bat --clean --config Release > build.log 2>&1
          set RC=%ERRORLEVEL%
          type build.log
          exit /b %RC%

      - name: Report compiler errors
        if: failure()
        shell: pwsh
        run: |
          # Surface the compiler errors as an annotation, readable without downloading the log
          $lines = Select-String -Path build.log -Pattern ': (fatal )?error |ammio.src.*: warning C4' |
                   Select-Object -First 60 | ForEach-Object { $_.Line.Trim() }
          if ($lines) { Write-Output ("::error title=MSVC::" + ($lines -join '%0A')) }

      - name: Unit tests
        shell: cmd
        run: build\Release\ammio_unit_tests.exe

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Integration tests
        shell: bash
        run: |
          pip install -r tests/integration/requirements.txt
          AMMIO_BIN=build/Release/ammio.exe pytest tests/integration -v --ignore=tests/integration/test_trdp.py
